<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>第一回はるさめ宝くじ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- 上部アイコン -->
    <div class="top-controls">

      <div class="left-controls">

        <div class="circle-button camera-button">
          <span class="camera-icon">📷</span>
        </div>

        <div class="ads-button">
          <span>ADS</span>
        </div>

      </div>


      <div class="circle-button settings-button">
        <span class="settings-icon">⚙</span>
      </div>

    </div>


    <!-- タイトル -->
    <h1 class="title">
      第一回はるさめ宝くじ
    </h1>


    <!-- ルーレットエリア -->
    <section class="roulette-section">

      <!-- 矢印 -->
      <div class="pointer"></div>


      <!-- SVGルーレット -->
      <div class="wheel-container">

        <svg
          id="rouletteSvg"
          class="roulette-svg"
          viewBox="0 0 1000 1000"
          xmlns="http://www.w3.org/2000/svg"
        >

          <!-- 回転する部分 -->
          <g id="wheelGroup"></g>

        </svg>


        <!-- 中央START -->
        <button
          id="spinButton"
          class="start-button"
          type="button"
        >
          START
        </button>

      </div>

    </section>


    <!-- 結果 -->
    <div
      id="resultArea"
      class="result-area"
    >
      結果:<span id="resultNumber">?</span>
    </div>

  </main>


  <!-- 下部 -->
  <footer class="bottom-bar">

    <div class="data-text">
      データをセット
    </div>

  </footer>


  <script src="script.js"></script>

</body>
</html>
