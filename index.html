<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>さめジャンボ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- 上部 -->
    <header class="top-bar">

      <button class="icon-button" aria-label="カメラ">
        📷
      </button>

      <div class="ads-off">
        ADS
      </div>

      <button class="icon-button" aria-label="設定">
        ⚙
      </button>

    </header>


    <!-- タイトル -->
    <h1 class="title">
      第一回はるさめジャンボ
    </h1>


    <!-- ルーレット -->
    <div class="roulette-area">

      <!-- 矢印 -->
      <div class="pointer"></div>


      <div class="wheel-wrapper">

        <div class="wheel" id="wheel">

          <div class="number n0">0</div>
          <div class="number n1">1</div>
          <div class="number n2">2</div>
          <div class="number n3">3</div>
          <div class="number n4">4</div>
          <div class="number n5">5</div>
          <div class="number n6">6</div>
          <div class="number n7">7</div>
          <div class="number n8">8</div>
          <div class="number n9">9</div>

        </div>


        <!-- 中央START -->
        <button id="spinButton" class="start-button">
          START
        </button>

      </div>

    </div>


    <!-- 結果 -->
    <div class="result-area" id="resultArea">

      <span class="result-label">結果:</span>

      <span class="result-number" id="resultNumber">
        ?
      </span>

    </div>

  </div>


  <!-- 下部 -->
  <footer class="bottom-bar">

    <div class="data-set">
      データをセット
    </div>

  </footer>


  <script src="script.js"></script>

</body>
</html>
